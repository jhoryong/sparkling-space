<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02030a">
  <meta name="description" content="Breathing Universe is a web-based interactive installation exploring the concept of space and time.">
  <title>Breathing Universe</title>
  <style>
    :root {
      color-scheme: dark;
      background: #02030a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, #080d1f 0%, #030511 40%, #02030a 72%);
    }

    body {
      min-height: 100dvh;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
    }

  </style>
</head>
<body>
  <canvas id="universe"></canvas>

  <script>
    (() => {
      'use strict';

      const CONFIG = Object.freeze({
        starsPerMegapixel: 737,
        minStars: 405,
        maxStars: 1517,
        maxDpr: 2,
        maxBackingPixels: 3_000_000,
        wheelImpulse: 2,
        maxScrollSpeed: 1500,
        velocityResponse: 9,
        scrollFriction: 1.8,
        trailLengthFactor: 0.22,
        maxTrailLength: 280,
        trailSpeedThreshold: 4,
        trailQualityRatios: Object.freeze([0.22, 0.55, 1]),
        glowQualityRatios: Object.freeze([0.55, 0.8, 1]),
        coreGlowThreshold: 0.18,
        slowFrameThreshold: 18.5,
        fastFrameThreshold: 17.2,
        degradeDuration: 750,
        upgradeDuration: 3000,
        qualityCooldown: 1500,
        debugStats: true,
        statsInterval: 1000,
        resizeDelay: 140
      });

      // 색은 항성의 표면 온도와 진화 단계에서 가져오되, 시각적 균형을 위해 분포를 조정했다.
      const STAR_TYPES = Object.freeze([
        { name: 'blue',       rgb: '186, 213, 255', glow: '125, 176, 255', weight: 0.04, size: 0.92, energy: 1.10 },
        { name: 'blue-white', rgb: '224, 237, 255', glow: '166, 205, 255', weight: 0.16, size: 0.84, energy: 1.05 },
        { name: 'white',      rgb: '250, 252, 255', glow: '220, 234, 255', weight: 0.495, size: 0.72, energy: 1.00 },
        { name: 'yellow',     rgb: '255, 244, 210', glow: '255, 220, 153', weight: 0.16, size: 0.74, energy: 0.95 },
        { name: 'orange',     rgb: '255, 210, 165', glow: '255, 164, 105', weight: 0.09, size: 0.82, energy: 0.90 },
        { name: 'red-giant',  rgb: '255, 170, 145', glow: '255, 98, 77',   weight: 0.015, size: 1.08, energy: 0.78 },
        { name: 'white-dwarf',rgb: '235, 247, 255', glow: '183, 224, 255', weight: 0.04, size: 0.50, energy: 1.18 }
      ]);

      const canvas = document.getElementById('universe');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const starSprites = new Map();
      const trailSprites = new Map();

      if (!ctx) return;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let stars = [];
      let animationId = 0;
      let lastTime = 0;
      let resizeTimer = 0;
      let scrollVelocity = 0;
      let targetScrollVelocity = 0;
      let scrollOffset = 0;
      let backingPixelDemand = 0;
      let qualityLevel = 2;
      let frameTimeEma = 16.67;
      let slowFrameDuration = 0;
      let fastFrameDuration = 0;
      let qualityCooldownUntil = 0;
      let statsWindowStart = 0;
      let statsFrameCount = 0;
      let statsTrailDraws = 0;
      let statsGlowDraws = 0;
      let statsCoreDraws = 0;

      const QUALITY_NAMES = Object.freeze(['Performance', 'Balanced', 'High']);

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function pickStarType() {
        let choice = Math.random();
        for (let index = 0; index < STAR_TYPES.length; index += 1) {
          choice -= STAR_TYPES[index].weight;
          if (choice <= 0) return STAR_TYPES[index];
        }
        return STAR_TYPES[2];
      }

      function getStarSprite(type) {
        if (starSprites.has(type.name)) return starSprites.get(type.name);

        const sprite = document.createElement('canvas');
        const size = 64;
        const center = size * 0.5;
        const spriteCtx = sprite.getContext('2d');
        sprite.width = size;
        sprite.height = size;

        const glow = spriteCtx.createRadialGradient(center, center, 0, center, center, center);
        glow.addColorStop(0, `rgba(${type.rgb}, 1)`);
        glow.addColorStop(0.08, `rgba(${type.rgb}, 0.94)`);
        glow.addColorStop(0.22, `rgba(${type.glow}, 0.34)`);
        glow.addColorStop(0.52, `rgba(${type.glow}, 0.11)`);
        glow.addColorStop(0.78, `rgba(${type.glow}, 0.035)`);
        glow.addColorStop(1, `rgba(${type.glow}, 0)`);
        spriteCtx.fillStyle = glow;
        spriteCtx.fillRect(0, 0, size, size);
        starSprites.set(type.name, sprite);
        return sprite;
      }

      function getTrailSprite(type, direction) {
        const key = `${type.name}:${direction}`;
        if (trailSprites.has(key)) return trailSprites.get(key);

        const sprite = document.createElement('canvas');
        const spriteCtx = sprite.getContext('2d');
        const spriteWidth = 24;
        const spriteHeight = 128;
        const headY = direction === 'down' ? 0 : spriteHeight;
        const tailY = direction === 'down' ? spriteHeight : 0;
        sprite.width = spriteWidth;
        sprite.height = spriteHeight;

        const verticalFade = spriteCtx.createLinearGradient(0, headY, 0, tailY);
        verticalFade.addColorStop(0, `rgba(${type.rgb}, 0.95)`);
        verticalFade.addColorStop(0.08, `rgba(${type.glow}, 0.55)`);
        verticalFade.addColorStop(0.36, `rgba(${type.glow}, 0.18)`);
        verticalFade.addColorStop(0.72, `rgba(${type.glow}, 0.045)`);
        verticalFade.addColorStop(1, `rgba(${type.glow}, 0)`);
        spriteCtx.fillStyle = verticalFade;
        spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);

        spriteCtx.globalCompositeOperation = 'destination-in';
        const horizontalFade = spriteCtx.createLinearGradient(0, 0, spriteWidth, 0);
        horizontalFade.addColorStop(0, 'rgba(255, 255, 255, 0)');
        horizontalFade.addColorStop(0.36, 'rgba(255, 255, 255, 1)');
        horizontalFade.addColorStop(0.64, 'rgba(255, 255, 255, 1)');
        horizontalFade.addColorStop(1, 'rgba(255, 255, 255, 0)');
        spriteCtx.fillStyle = horizontalFade;
        spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);

        trailSprites.set(key, sprite);
        return sprite;
      }

      function createStar(normalizedX = Math.random(), normalizedY = Math.random()) {
        const type = pickStarType();
        const depth = random(0.18, 1);
        const rarityBoost = Math.pow(Math.random(), 7) * 0.82;
        const baseSize = (random(0.28, 0.82) + rarityBoost) * type.size * (0.72 + depth * 0.38);

        return {
          nx: normalizedX,
          ny: normalizedY,
          x: normalizedX * width,
          y: normalizedY * height,
          depth,
          size: baseSize,
          baseAlpha: random(0.22, 0.70) * type.energy,
          twinkleAmount: random(0.20, 0.34),
          twinkleSpeed: random(0.0009, 0.0013),
          phase: random(0, Math.PI * 2),
          driftPhase: random(0, Math.PI * 2),
          rgb: type.rgb,
          glow: type.glow,
          sprite: getStarSprite(type),
          trailUp: getTrailSprite(type, 'up'),
          trailDown: getTrailSprite(type, 'down'),
          trailRank: 1,
          spike: false,
          spikeEligible: type.name !== 'red-giant',
          spikeAngle: Math.random() < 0.5 ? 0 : Math.PI * 0.25,
          spikeLength: random(6.5, 9.5),
          renderX: 0,
          renderY: 0,
          renderRadius: 0,
          renderAlpha: 0,
          renderGlowAlpha: 0,
          renderGlowScale: 0,
          renderLightLevel: 0,
          renderTrailLength: 0,
          renderTrailAlpha: 0,
          renderGlowRadius: 0,
          renderGlowDrawn: false
        };
      }

      function targetStarCount() {
        const megapixels = (width * height) / 1_000_000;
        return Math.round(clamp(
          megapixels * CONFIG.starsPerMegapixel,
          CONFIG.minStars,
          CONFIG.maxStars
        ));
      }

      function reconcileStars() {
        const target = targetStarCount();
        if (stars.length < target) {
          while (stars.length < target) stars.push(createStar());
        } else if (stars.length > target) {
          stars.length = target;
        }

        for (let index = 0; index < stars.length; index += 1) {
          const star = stars[index];
          star.x = star.nx * width;
          star.y = star.ny * height;
          star.spike = false;
        }

        const spikeCount = Math.round(clamp(stars.length / 120, 7, 18));
        const brightestStars = stars
          .filter((star) => star.spikeEligible)
          .sort((a, b) => (b.size * b.baseAlpha) - (a.size * a.baseAlpha));
        for (let index = 0; index < Math.min(spikeCount, brightestStars.length); index += 1) {
          brightestStars[index].spike = true;
        }

        const trailPriority = stars
          .slice()
          .sort((a, b) => {
            const scoreA = a.depth * 0.7 + a.baseAlpha * 0.3;
            const scoreB = b.depth * 0.7 + b.baseAlpha * 0.3;
            return scoreB - scoreA;
          });
        const priorityDivisor = Math.max(1, trailPriority.length - 1);
        for (let index = 0; index < trailPriority.length; index += 1) {
          trailPriority[index].trailRank = index / priorityDivisor;
        }
      }

      function resetQualityState() {
        qualityLevel = backingPixelDemand > CONFIG.maxBackingPixels ? 1 : 2;
        frameTimeEma = 16.67;
        slowFrameDuration = 0;
        fastFrameDuration = 0;
        qualityCooldownUntil = 0;
        statsWindowStart = 0;
        statsFrameCount = 0;
        statsTrailDraws = 0;
        statsGlowDraws = 0;
        statsCoreDraws = 0;
      }

      function resize() {
        const nextWidth = Math.max(1, window.innerWidth);
        const nextHeight = Math.max(1, window.innerHeight);
        width = nextWidth;
        height = nextHeight;
        const deviceDpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
        backingPixelDemand = width * height * deviceDpr * deviceDpr;
        const resolutionScale = Math.min(
          1,
          Math.sqrt(CONFIG.maxBackingPixels / backingPixelDemand)
        );
        dpr = deviceDpr * resolutionScale;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        reconcileStars();
        resetQualityState();
        if (CONFIG.debugStats) {
          console.log('[Universe] canvas', {
            cssSize: `${width}x${height}`,
            backingSize: `${canvas.width}x${canvas.height}`,
            backingPixels: canvas.width * canvas.height,
            effectiveDpr: Number(dpr.toFixed(3)),
            stars: stars.length,
            initialQuality: QUALITY_NAMES[qualityLevel]
          });
        }
        draw(performance.now());
        statsTrailDraws = 0;
        statsGlowDraws = 0;
        statsCoreDraws = 0;
      }

      function wrap(value, range) {
        return ((value % range) + range) % range;
      }

      function prepareStarFrame(star, time, speedAboveThreshold, speedRatio) {
        const wave = Math.sin(time * star.twinkleSpeed + star.phase);
        const pulse = 0.5 + wave * 0.5;
        const lightLevel = pulse * pulse * (3 - 2 * pulse);
        const alpha = clamp(star.baseAlpha * (0.30 + lightLevel * 0.74), 0.08, 1);
        const glowAlpha = clamp(
          (0.001 + lightLevel * (0.637 + star.twinkleAmount)) * (0.58 + star.baseAlpha * 0.64),
          0.015,
          1
        );
        const scale = 0.94 + lightLevel * 0.075;
        const glowScale = 0.24 + lightLevel * 1.16;

        const drift = Math.sin(time * 0.00008 + star.driftPhase) * 0.45;
        const radius = Math.max(0.35, star.size * scale);
        const trailLength = Math.min(
          CONFIG.maxTrailLength,
          speedAboveThreshold * CONFIG.trailLengthFactor * star.depth
        );

        star.renderX = star.x + drift * star.depth;
        star.renderY = wrap(star.y + scrollOffset * star.depth + drift * 0.35, height);
        star.renderRadius = radius;
        star.renderAlpha = alpha;
        star.renderGlowAlpha = glowAlpha;
        star.renderGlowScale = glowScale;
        star.renderLightLevel = lightLevel;
        star.renderTrailLength = trailLength;
        star.renderTrailAlpha = Math.sqrt(speedRatio) * (0.34 + alpha * 0.56);
        star.renderGlowRadius = Math.max(3.2, radius * 7.2) * glowScale;
        star.renderGlowDrawn = false;
      }

      function drawTrailAt(star, y, movingUp) {
        const trailWidth = Math.max(1.5, star.renderRadius * 2.6);
        const trailY = movingUp ? y : y - star.renderTrailLength;
        ctx.globalAlpha = star.renderTrailAlpha;
        ctx.drawImage(
          movingUp ? star.trailDown : star.trailUp,
          star.renderX - trailWidth * 0.5,
          trailY,
          trailWidth,
          star.renderTrailLength
        );
        if (CONFIG.debugStats) statsTrailDraws += 1;
      }

      function drawGlowAt(star, y) {
        const glowRadius = star.renderGlowRadius;
        ctx.globalAlpha = star.renderGlowAlpha * 0.58;
        ctx.drawImage(
          star.sprite,
          star.renderX - glowRadius,
          y - glowRadius,
          glowRadius * 2,
          glowRadius * 2
        );
        if (CONFIG.debugStats) statsGlowDraws += 1;
      }

      function drawCoreAt(star, y, drawPoint) {
        const x = star.renderX;
        const radius = star.renderRadius;
        if (drawPoint) {
          ctx.fillStyle = `rgba(${star.rgb}, ${star.renderAlpha})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
          if (CONFIG.debugStats) statsCoreDraws += 1;
        }

        if (star.spike && star.renderLightLevel > 0.22) {
          const spikeVisibility = (star.renderLightLevel - 0.22) / 0.78;
          const longRay = radius * star.spikeLength * (0.82 + spikeVisibility * 0.28);
          const shortRay = longRay * 0.8;
          const cosA = Math.cos(star.spikeAngle);
          const sinA = Math.sin(star.spikeAngle);
          const cosB = -sinA;
          const sinB = cosA;

          ctx.strokeStyle = `rgba(${star.rgb}, ${spikeVisibility * star.renderGlowAlpha * 0.34})`;
          ctx.lineWidth = 0.58;
          ctx.beginPath();
          ctx.moveTo(x - cosA * longRay, y - sinA * longRay);
          ctx.lineTo(x + cosA * longRay, y + sinA * longRay);
          ctx.moveTo(x - cosB * shortRay, y - sinB * shortRay);
          ctx.lineTo(x + cosB * shortRay, y + sinB * shortRay);
          ctx.stroke();
        }
      }

      function drawTrailPass() {
        const trailRatio = CONFIG.trailQualityRatios[qualityLevel];
        const movingUp = scrollVelocity < 0;
        ctx.globalCompositeOperation = 'lighter';

        for (let index = 0; index < stars.length; index += 1) {
          const star = stars[index];
          if (star.renderTrailLength <= 0 || star.trailRank > trailRatio) continue;
          const y = star.renderY;
          drawTrailAt(star, y, movingUp);
          if (y - star.renderTrailLength < 0) {
            drawTrailAt(star, y + height, movingUp);
          } else if (y + star.renderTrailLength > height) {
            drawTrailAt(star, y - height, movingUp);
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawGlowPass() {
        const glowRatio = CONFIG.glowQualityRatios[qualityLevel];
        ctx.globalCompositeOperation = 'lighter';
        for (let index = 0; index < stars.length; index += 1) {
          const star = stars[index];
          if (star.trailRank > glowRatio) continue;
          star.renderGlowDrawn = true;
          const y = star.renderY;
          drawGlowAt(star, y);
          if (y - star.renderGlowRadius < 0) {
            drawGlowAt(star, y + height);
          } else if (y + star.renderGlowRadius > height) {
            drawGlowAt(star, y - height);
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawCorePass() {
        ctx.globalCompositeOperation = 'source-over';
        for (let index = 0; index < stars.length; index += 1) {
          const star = stars[index];
          const drawPoint = !star.renderGlowDrawn
            || star.renderGlowAlpha < CONFIG.coreGlowThreshold;
          if (!drawPoint && !star.spike) continue;
          const y = star.renderY;
          const coreReach = star.spike
            ? star.renderRadius * star.spikeLength * 1.1
            : star.renderRadius;
          drawCoreAt(star, y, drawPoint);
          if (y - coreReach < 0) {
            drawCoreAt(star, y + height, drawPoint);
          } else if (y + coreReach > height) {
            drawCoreAt(star, y - height, drawPoint);
          }
        }
      }

      function draw(time) {
        ctx.clearRect(0, 0, width, height);
        const speedAboveThreshold = Math.max(
          0,
          Math.abs(scrollVelocity) - CONFIG.trailSpeedThreshold
        );
        const speedRatio = clamp(
          speedAboveThreshold / (CONFIG.maxScrollSpeed - CONFIG.trailSpeedThreshold),
          0,
          1
        );
        for (let index = 0; index < stars.length; index += 1) {
          prepareStarFrame(stars[index], time, speedAboveThreshold, speedRatio);
        }
        drawTrailPass();
        drawGlowPass();
        drawCorePass();
      }

      function updateAdaptiveQuality(frameTime, time) {
        frameTimeEma += (frameTime - frameTimeEma) * 0.08;
        const trailsActive =
          Math.abs(scrollVelocity) > CONFIG.trailSpeedThreshold ||
          Math.abs(targetScrollVelocity) > CONFIG.trailSpeedThreshold;

        if (!trailsActive || time < qualityCooldownUntil) {
          slowFrameDuration = 0;
          fastFrameDuration = 0;
          return;
        }

        if (frameTimeEma > CONFIG.slowFrameThreshold) {
          slowFrameDuration += frameTime;
          fastFrameDuration = 0;
          if (slowFrameDuration >= CONFIG.degradeDuration && qualityLevel > 0) {
            const previousQuality = qualityLevel;
            qualityLevel -= 1;
            slowFrameDuration = 0;
            qualityCooldownUntil = time + CONFIG.qualityCooldown;
            if (CONFIG.debugStats) {
              console.log('[Universe] quality change', {
                from: QUALITY_NAMES[previousQuality],
                to: QUALITY_NAMES[qualityLevel],
                reason: 'slow frames',
                frameTimeEma: Number(frameTimeEma.toFixed(2))
              });
            }
          }
        } else if (frameTimeEma < CONFIG.fastFrameThreshold) {
          fastFrameDuration += frameTime;
          slowFrameDuration = 0;
          if (fastFrameDuration >= CONFIG.upgradeDuration && qualityLevel < 2) {
            const previousQuality = qualityLevel;
            qualityLevel += 1;
            fastFrameDuration = 0;
            qualityCooldownUntil = time + CONFIG.qualityCooldown;
            if (CONFIG.debugStats) {
              console.log('[Universe] quality change', {
                from: QUALITY_NAMES[previousQuality],
                to: QUALITY_NAMES[qualityLevel],
                reason: 'stable frames',
                frameTimeEma: Number(frameTimeEma.toFixed(2))
              });
            }
          }
        } else {
          slowFrameDuration = 0;
          fastFrameDuration = 0;
        }
      }

      function logPerformanceStats(time) {
        if (!CONFIG.debugStats) return;
        if (statsWindowStart === 0) statsWindowStart = time;
        statsFrameCount += 1;
        const elapsed = time - statsWindowStart;
        if (elapsed < CONFIG.statsInterval) return;

        console.log('[Universe] performance', {
          fps: Number((statsFrameCount * 1000 / elapsed).toFixed(1)),
          averageFrameMs: Number((elapsed / statsFrameCount).toFixed(2)),
          frameTimeEma: Number(frameTimeEma.toFixed(2)),
          quality: QUALITY_NAMES[qualityLevel],
          trailRatio: CONFIG.trailQualityRatios[qualityLevel],
          glowRatio: CONFIG.glowQualityRatios[qualityLevel],
          trailsPerFrame: Math.round(statsTrailDraws / statsFrameCount),
          glowsPerFrame: Math.round(statsGlowDraws / statsFrameCount),
          coresPerFrame: Math.round(statsCoreDraws / statsFrameCount),
          stars: stars.length,
          scrollVelocity: Math.round(scrollVelocity),
          backingPixels: canvas.width * canvas.height
        });

        statsWindowStart = time;
        statsFrameCount = 0;
        statsTrailDraws = 0;
        statsGlowDraws = 0;
        statsCoreDraws = 0;
      }

      function animate(time) {
        const frameTime = lastTime ? Math.min(time - lastTime, 50) : 16.67;
        const deltaTime = frameTime / 1000;
        lastTime = time;
        const velocityBlend = 1 - Math.exp(-CONFIG.velocityResponse * deltaTime);
        scrollVelocity += (targetScrollVelocity - scrollVelocity) * velocityBlend;
        targetScrollVelocity *= Math.exp(-CONFIG.scrollFriction * deltaTime);
        if (Math.abs(targetScrollVelocity) < 0.5) targetScrollVelocity = 0;
        if (targetScrollVelocity === 0 && Math.abs(scrollVelocity) < 0.5) scrollVelocity = 0;
        scrollOffset += scrollVelocity * deltaTime;
        updateAdaptiveQuality(frameTime, time);

        if (Math.abs(scrollOffset) > height * 100) {
          for (let index = 0; index < stars.length; index += 1) {
            const star = stars[index];
            star.y = wrap(star.y + scrollOffset * star.depth, height);
            star.ny = star.y / height;
          }
          scrollOffset = 0;
        }

        draw(time);
        logPerformanceStats(time);
        animationId = requestAnimationFrame(animate);
      }

      function normalizeWheelDelta(event) {
        if (event.deltaMode === 1) return event.deltaY * 16;
        if (event.deltaMode === 2) return event.deltaY * height;
        return event.deltaY;
      }

      window.addEventListener('wheel', (event) => {
        const delta = clamp(normalizeWheelDelta(event), -1200, 1200);
        targetScrollVelocity = clamp(
          targetScrollVelocity - delta * CONFIG.wheelImpulse,
          -CONFIG.maxScrollSpeed,
          CONFIG.maxScrollSpeed
        );
      }, { passive: true });

      window.addEventListener('resize', () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(resize, CONFIG.resizeDelay);
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(animationId);
          animationId = 0;
          scrollVelocity = 0;
          targetScrollVelocity = 0;
          resetQualityState();
        } else if (!animationId) {
          lastTime = 0;
          animationId = requestAnimationFrame(animate);
        }
      });

      resize();
      animationId = requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
