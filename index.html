<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010105">
  <meta name="description" content="Breathing Universe is a web-based interactive installation exploring the concept of space and time.">
  <title>Breathing Universe</title>
  <style>
    :root {
      color-scheme: dark;
      background: #010105;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #010105;
    }

    body {
      min-height: 100dvh;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
    }

  </style>
</head>
<body>
  <canvas id="universe"></canvas>

  <script>
    (() => {
      'use strict';

      const CONFIG = Object.freeze({
        maxDpr: 2,
        maxBackingPixels: 8_300_000,
        wheelImpulse: 2,
        maxScrollSpeed: 1500,
        velocityResponse: 9,
        scrollFriction: 5,
        trailLengthFactor: 0.22,
        maxTrailLength: 280,
        trailSpeedThreshold: 4,
        desktopIdleFps: 30,
        tabletIdleFps: 24,
        resizeDelay: 140
      });

      const STAR_COLORS = Object.freeze([
        '166, 198, 255',
        '210, 223, 248',
        '154, 220, 255',
        '179, 238, 255',
        '255, 248, 222'
      ]);
      const RED_GIANT_COLOR = '255, 138, 112';
      const RED_GIANT_CHANCE = 0.03;

      const canvas = document.getElementById('universe');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const trailSprites = new Map();

      if (!ctx) return;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let stars = [];
      let animationId = 0;
      let lastTime = 0;
      let lastDrawTime = 0;
      let resizeTimer = 0;
      let scrollVelocity = 0;
      let targetScrollVelocity = 0;
      let scrollOffset = 0;
      let trailRatio = 1;

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function getTrailSprite(rgb, direction) {
        const key = `${rgb}:${direction}`;
        if (trailSprites.has(key)) return trailSprites.get(key);

        const sprite = document.createElement('canvas');
        const spriteCtx = sprite.getContext('2d');
        const spriteWidth = 24;
        const spriteHeight = 128;
        const headY = direction === 'down' ? 0 : spriteHeight;
        const tailY = direction === 'down' ? spriteHeight : 0;
        sprite.width = spriteWidth;
        sprite.height = spriteHeight;

        const verticalFade = spriteCtx.createLinearGradient(0, headY, 0, tailY);
        verticalFade.addColorStop(0, `rgba(${rgb}, 0.95)`);
        verticalFade.addColorStop(0.08, `rgba(${rgb}, 0.55)`);
        verticalFade.addColorStop(0.36, `rgba(${rgb}, 0.18)`);
        verticalFade.addColorStop(0.72, `rgba(${rgb}, 0.045)`);
        verticalFade.addColorStop(1, `rgba(${rgb}, 0)`);
        spriteCtx.fillStyle = verticalFade;
        spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);

        spriteCtx.globalCompositeOperation = 'destination-in';
        const horizontalFade = spriteCtx.createLinearGradient(0, 0, spriteWidth, 0);
        horizontalFade.addColorStop(0, 'rgba(255, 255, 255, 0)');
        horizontalFade.addColorStop(0.36, 'rgba(255, 255, 255, 1)');
        horizontalFade.addColorStop(0.64, 'rgba(255, 255, 255, 1)');
        horizontalFade.addColorStop(1, 'rgba(255, 255, 255, 0)');
        spriteCtx.fillStyle = horizontalFade;
        spriteCtx.fillRect(0, 0, spriteWidth, spriteHeight);

        trailSprites.set(key, sprite);
        return sprite;
      }

      function createStar(normalizedX = Math.random(), normalizedY = Math.random()) {
        const isRedGiant = Math.random() < RED_GIANT_CHANCE;
        const rgb = isRedGiant
          ? RED_GIANT_COLOR
          : STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
        const depth = random(0.18, 1);
        const baseSize = random(0.37, 0.92) * 1.2 * (0.72 + depth * 0.38);

        return {
          nx: normalizedX,
          ny: normalizedY,
          x: normalizedX * width,
          y: normalizedY * height,
          depth,
          size: baseSize,
          twinkleDuration: random(2000, 3600),
          phase: random(0, Math.PI * 2),
          rgb,
          trailUp: getTrailSprite(rgb, 'up'),
          trailDown: getTrailSprite(rgb, 'down'),
          trailRank: 1,
          spike: false,
          spikeEligible: !isRedGiant,
          spikePriority: Math.random(),
          spikeAngle: Math.random() < 0.5 ? 0 : Math.PI * 0.25,
          spikeLength: random(2.5, 4),
          renderY: 0,
          renderAlpha: 0,
          renderTrailLength: 0,
          renderTrailAlpha: 0,
        };
      }

      function reconcileStars() {
        const target = width <= 1280 ? 300 : 600;
        if (stars.length < target) {
          while (stars.length < target) stars.push(createStar());
        } else if (stars.length > target) {
          stars.length = target;
        }

        for (let index = 0; index < stars.length; index += 1) {
          const star = stars[index];
          star.x = star.nx * width;
          star.y = star.ny * height;
          star.spike = false;
        }

        const spikeCount = Math.round(stars.length * 0.1);
        const spikeStars = stars
          .filter((star) => star.spikeEligible)
          .sort((a, b) => a.spikePriority - b.spikePriority);
        for (let index = 0; index < Math.min(spikeCount, spikeStars.length); index += 1) {
          spikeStars[index].spike = true;
        }

        const trailPriority = stars
          .slice()
          .sort((a, b) => b.depth - a.depth);
        const priorityDivisor = Math.max(1, trailPriority.length - 1);
        for (let index = 0; index < trailPriority.length; index += 1) {
          trailPriority[index].trailRank = index / priorityDivisor;
        }
      }

      function resize() {
        const nextWidth = Math.max(1, window.innerWidth);
        const nextHeight = Math.max(1, window.innerHeight);
        width = nextWidth;
        height = nextHeight;
        const deviceDpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
        const backingPixelDemand = width * height * deviceDpr * deviceDpr;
        const resolutionScale = Math.min(
          1,
          Math.sqrt(CONFIG.maxBackingPixels / backingPixelDemand)
        );
        dpr = deviceDpr * resolutionScale;
        trailRatio = backingPixelDemand > CONFIG.maxBackingPixels ? 0.55 : 1;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        reconcileStars();
        lastDrawTime = performance.now();
        draw(lastDrawTime);
      }

      function wrap(value, range) {
        return ((value % range) + range) % range;
      }

      function prepareStarFrame(star, time, speedAboveThreshold, speedRatio) {
        const lightLevel = Math.cos(
          time / star.twinkleDuration * Math.PI * 2 + star.phase
        ) * -0.5 + 0.5;
        const alpha = 0.1 + lightLevel * 0.9;

        const trailLength = Math.min(
          CONFIG.maxTrailLength,
          speedAboveThreshold * CONFIG.trailLengthFactor * star.depth
        );

        star.renderY = wrap(star.y + scrollOffset * star.depth, height);
        star.renderAlpha = alpha;
        star.renderTrailLength = trailLength;
        star.renderTrailAlpha = Math.sqrt(speedRatio) * (0.34 + alpha * 0.56);
      }

      function drawTrailAt(star, y, movingUp) {
        const trailWidth = Math.max(1.5, star.size * 2.6);
        const trailY = movingUp ? y : y - star.renderTrailLength;
        ctx.globalAlpha = star.renderTrailAlpha;
        ctx.drawImage(
          movingUp ? star.trailDown : star.trailUp,
          star.x - trailWidth * 0.5,
          trailY,
          trailWidth,
          star.renderTrailLength
        );
      }

      function drawCoreAt(star, y) {
        const x = star.x;
        const radius = star.size;
        ctx.fillStyle = `rgba(${star.rgb}, ${star.renderAlpha})`;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        if (star.spike) {
          const longRay = radius * star.spikeLength;
          const shortRay = star.spikeAngle === 0 ? longRay * 0.8 : longRay;
          const cosA = Math.cos(star.spikeAngle);
          const sinA = Math.sin(star.spikeAngle);
          const cosB = -sinA;
          const sinB = cosA;

          ctx.strokeStyle = `rgba(${star.rgb}, ${star.renderAlpha * 0.55})`;
          ctx.lineWidth = 0.7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x - cosA * longRay, y - sinA * longRay);
          ctx.lineTo(x + cosA * longRay, y + sinA * longRay);
          ctx.moveTo(x - cosB * shortRay, y - sinB * shortRay);
          ctx.lineTo(x + cosB * shortRay, y + sinB * shortRay);
          ctx.stroke();
        }
      }

      function drawTrailPass() {
        const movingUp = scrollVelocity < 0;
        ctx.globalCompositeOperation = 'lighter';

        for (let index = 0; index < stars.length; index += 1) {
          const star = stars[index];
          if (star.renderTrailLength <= 0 || star.trailRank > trailRatio) continue;
          const y = star.renderY;
          drawTrailAt(star, y, movingUp);
          if (y - star.renderTrailLength < 0) {
            drawTrailAt(star, y + height, movingUp);
          } else if (y + star.renderTrailLength > height) {
            drawTrailAt(star, y - height, movingUp);
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawCorePass() {
        ctx.globalCompositeOperation = 'source-over';
        for (let index = 0; index < stars.length; index += 1) {
          const star = stars[index];
          const y = star.renderY;
          const coreReach = star.spike
            ? star.size * star.spikeLength
            : star.size;
          drawCoreAt(star, y);
          if (y - coreReach < 0) {
            drawCoreAt(star, y + height);
          } else if (y + coreReach > height) {
            drawCoreAt(star, y - height);
          }
        }
      }

      function draw(time) {
        ctx.clearRect(0, 0, width, height);
        const speedAboveThreshold = Math.max(
          0,
          Math.abs(scrollVelocity) - CONFIG.trailSpeedThreshold
        );
        const speedRatio = clamp(
          speedAboveThreshold / (CONFIG.maxScrollSpeed - CONFIG.trailSpeedThreshold),
          0,
          1
        );
        for (let index = 0; index < stars.length; index += 1) {
          prepareStarFrame(stars[index], time, speedAboveThreshold, speedRatio);
        }
        if (speedAboveThreshold > 0) drawTrailPass();
        drawCorePass();
      }

      function animate(time) {
        const frameTime = lastTime ? Math.min(time - lastTime, 50) : 16.67;
        const deltaTime = frameTime / 1000;
        lastTime = time;
        const velocityBlend = 1 - Math.exp(-CONFIG.velocityResponse * deltaTime);
        scrollVelocity += (targetScrollVelocity - scrollVelocity) * velocityBlend;
        targetScrollVelocity *= Math.exp(-CONFIG.scrollFriction * deltaTime);
        if (Math.abs(targetScrollVelocity) < 0.5) targetScrollVelocity = 0;
        if (targetScrollVelocity === 0 && Math.abs(scrollVelocity) < 0.5) scrollVelocity = 0;
        scrollOffset += scrollVelocity * deltaTime;

        if (Math.abs(scrollOffset) > height * 100) {
          for (let index = 0; index < stars.length; index += 1) {
            const star = stars[index];
            star.y = wrap(star.y + scrollOffset * star.depth, height);
            star.ny = star.y / height;
          }
          scrollOffset = 0;
        }

        const isMoving =
          Math.abs(scrollVelocity) > CONFIG.trailSpeedThreshold ||
          Math.abs(targetScrollVelocity) > CONFIG.trailSpeedThreshold;
        const idleFps = width <= 1280
          ? CONFIG.tabletIdleFps
          : CONFIG.desktopIdleFps;
        if (isMoving || time - lastDrawTime >= 1000 / idleFps) {
          draw(time);
          lastDrawTime = time;
        }
        animationId = requestAnimationFrame(animate);
      }

      function normalizeWheelDelta(event) {
        if (event.deltaMode === 1) return event.deltaY * 16;
        if (event.deltaMode === 2) return event.deltaY * height;
        return event.deltaY;
      }

      window.addEventListener('wheel', (event) => {
        const delta = clamp(normalizeWheelDelta(event), -1200, 1200);
        targetScrollVelocity = clamp(
          targetScrollVelocity - delta * CONFIG.wheelImpulse,
          -CONFIG.maxScrollSpeed,
          CONFIG.maxScrollSpeed
        );
      }, { passive: true });

      window.addEventListener('resize', () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(resize, CONFIG.resizeDelay);
      }, { passive: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(animationId);
          animationId = 0;
          scrollVelocity = 0;
          targetScrollVelocity = 0;
        } else if (!animationId) {
          lastTime = 0;
          animationId = requestAnimationFrame(animate);
        }
      });

      resize();
      animationId = requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
